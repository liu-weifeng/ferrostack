<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<style>
  /* 独立 demo 的基础 reset（与线上原型宿主一致）*/
  html { color-scheme: light dark; }
  body { margin:0; }
  img { max-width:100%; }
  [hidden] { display:none !important; }
  /* 主题切换按钮（仅 demo 用）*/
  .theme-fab { position:fixed; right:18px; bottom:18px; z-index:99; width:40px; height:40px; border-radius:50%;
               border:1px solid var(--line2); background:var(--surface); color:var(--ink); font-size:18px;
               box-shadow:0 2px 8px rgba(0,0,0,.18); display:flex; align-items:center; justify-content:center; }
  .theme-fab:hover { border-color:var(--accent); }
</style>
<title>xvirt 资源规划原型</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root {
    --bg:#f4f6f8; --surface:#ffffff; --surface2:#edf0f4; --ink:#1d2430; --muted:#5b6574;
    --line:#dfe4ec; --line2:#c3ccd8; --accent:#0e7490; --accent-soft:#e0f0f4;
    --ok:#15803d; --warn:#b45309; --warn-bg:#fdf3e3; --bad:#b42318; --bad-bg:#fbeae8;
    --p-os:#ad4a77; --p-virt:#4a8ee6; --p-spdk:#7434d6; --p-vm:#178f4e; --p-ded:#d98a0a;
    --hp2m:#12967d; --hp1g:#0a5a8f; --kern:#8a93a3; --swap:#64748b;
    --shadow:0 1px 3px rgba(15,23,42,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#12151b; --surface:#1a1e26; --surface2:#232833; --ink:#e3e7ee; --muted:#98a2b3;
      --line:#2b313c; --line2:#3d4552; --accent:#45b8cf; --accent-soft:#153840;
      --ok:#4cc27a; --warn:#e8a04c; --warn-bg:#33270f; --bad:#ef7365; --bad-bg:#3a1611;
      --p-os:#ad4a77; --p-virt:#4a8ee6; --p-spdk:#7d43dd; --p-vm:#0f7a41; --p-ded:#cd7f08;
      --hp2m:#12967d; --hp1g:#0d6ba6; --kern:#77808f; --swap:#7b8699;
      --shadow:0 1px 3px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg:#12151b; --surface:#1a1e26; --surface2:#232833; --ink:#e3e7ee; --muted:#98a2b3;
    --line:#2b313c; --line2:#3d4552; --accent:#45b8cf; --accent-soft:#153840;
    --ok:#4cc27a; --warn:#e8a04c; --warn-bg:#33270f; --bad:#ef7365; --bad-bg:#3a1611;
    --p-os:#ad4a77; --p-virt:#4a8ee6; --p-spdk:#7d43dd; --p-vm:#0f7a41; --p-ded:#cd7f08;
    --hp2m:#12967d; --hp1g:#0d6ba6; --kern:#77808f; --swap:#7b8699;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
  * { box-sizing:border-box; }
  body { background:var(--bg); color:var(--ink); font:14px/1.65 "Noto Sans SC","PingFang SC",sans-serif;
         -webkit-font-smoothing:antialiased; }
  .mono { font-family:"JetBrains Mono",monospace; }
  button { font:inherit; color:inherit; cursor:pointer; }
  button:focus-visible, [tabindex]:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }

  .shell { max-width:1280px; margin:0 auto; padding:0 20px 60px; }

  /* ── 页头（主机详情语境） ── */
  .crumbs { font-size:12.5px; color:var(--muted); padding:14px 2px 0; }
  .crumbs b { color:var(--ink); font-weight:600; }
  .tabs { display:flex; gap:2px; margin:10px 0 0; border-bottom:1px solid var(--line); }
  .tab { padding:7px 16px; font-size:13.5px; color:var(--muted); border:0; background:none;
         border-bottom:2px solid transparent; }
  .tab.on { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }

  /* ── 工具栏 ── */
  .toolbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:16px 0 14px; }
  .toolbar h1 { font-size:17px; font-weight:700; margin:0 8px 0 0; }
  .chip { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line);
          background:var(--surface); border-radius:999px; padding:2px 10px; font-size:12px;
          color:var(--muted); white-space:nowrap; }
  .chip .sw { width:9px; height:9px; border-radius:2px; flex:none; }
  .sp { flex:1; }
  .btn { border:1px solid var(--line2); background:var(--surface); border-radius:7px;
         padding:5px 14px; font-size:13px; font-weight:500; }
  .btn:hover { border-color:var(--accent); }
  .btn.pri { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.ghost { border-color:transparent; color:var(--muted); }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .seg-ctl { display:inline-flex; border:1px solid var(--line2); border-radius:7px; overflow:hidden; }
  .seg-ctl .btn { border:0; border-radius:0; }
  .seg-ctl .btn.on { background:var(--accent); color:#fff; }

  .badge { display:inline-block; font-size:11px; font-weight:700; border-radius:4px; padding:0 7px; }
  .b-now { background:var(--accent-soft); color:var(--accent); }
  .b-vm  { background:var(--warn-bg); color:var(--warn); }
  .b-boot{ background:var(--surface2); color:var(--muted); border:1px solid var(--line2); }
  .b-hot { background:var(--accent-soft); color:var(--accent); }

  .banner { display:flex; gap:10px; align-items:center; border:1px solid var(--line2);
            border-left:3px solid var(--warn); background:var(--warn-bg); border-radius:8px;
            padding:8px 14px; margin:0 0 14px; font-size:13px; }
  .banner button { margin-left:auto; border:0; background:none; color:var(--muted); font-size:15px; }

  /* ── 布局 ── */
  .grid { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:16px; align-items:start; }
  @media (max-width:960px){ .grid { grid-template-columns:minmax(0,1fr); } }
  .col { display:flex; flex-direction:column; gap:16px; min-width:0; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:12px;
          padding:16px 18px; box-shadow:var(--shadow); }
  .card h2 { font-size:14px; font-weight:700; margin:0 0 4px; display:flex; align-items:center; gap:8px; }
  .card h2 .hint { font-size:11.5px; color:var(--muted); font-weight:400; }
  .sub { font-size:12px; color:var(--muted); }

  /* ── 归户条 ── */
  .attr-bar { display:flex; gap:2px; height:26px; border-radius:6px; overflow:hidden;
              background:var(--surface2); margin:10px 0 6px; }
  .attr-bar .as { position:relative; min-width:3px; }
  .attr-legend { display:flex; flex-wrap:wrap; gap:4px 16px; font-size:12px; color:var(--muted); }
  .attr-legend .it { display:inline-flex; align-items:center; gap:6px; }
  .attr-legend .sw { width:9px; height:9px; border-radius:2px; }
  .attr-legend b { color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; }
  .svc-detail { margin-top:8px; padding-top:8px; border-top:1px dashed var(--line);
                display:flex; flex-wrap:wrap; gap:4px 18px; font-size:12px; color:var(--muted); }

  /* ── CPU 拓扑 ── */
  .numa { border:1px solid var(--line); border-radius:10px; padding:10px 14px 12px; margin-top:10px; }
  .numa-cap { display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--muted); margin-bottom:10px; }
  .numa-cap b { color:var(--ink); font-family:"JetBrains Mono",monospace; font-size:12px; }
  .cores { display:flex; flex-wrap:wrap; gap:9px; }
  .core { display:flex; flex-direction:column; gap:3px; align-items:center; border-radius:6px; padding:2px; }
  .core.sel { outline:2px solid var(--accent); outline-offset:1px; }
  .core.drop-ok { outline:2px dashed var(--ok); outline-offset:1px; }
  .core.drop-no { outline:2px dashed var(--bad); outline-offset:1px; }
  .core .tag { font-size:9.5px; font-family:"JetBrains Mono",monospace; line-height:1; height:10px;
               color:var(--p-ded); font-weight:600; max-width:46px; overflow:hidden; }
  .thr { width:42px; height:24px; border-radius:4px; border:1.5px solid; position:relative; overflow:hidden;
         font-family:"JetBrains Mono",monospace; font-size:10px; text-align:center; color:var(--ink);
         background:var(--surface2); }
  .thr .u { position:absolute; left:0; right:0; bottom:0; opacity:.35; transition:height .6s; }
  .thr .n { position:relative; z-index:1; }
  .po { border-color:var(--p-os); }   .po .u { background:var(--p-os); }
  .pv { border-color:var(--p-virt); } .pv .u { background:var(--p-virt); }
  .ps { border-color:var(--p-spdk); border-style:dashed; } .ps .u { background:var(--p-spdk); }
  .pm { border-color:var(--p-vm); }   .pm .u { background:var(--p-vm); }
  .pd { border-color:var(--p-ded); background:color-mix(in srgb,var(--p-ded) 14%,var(--surface)); }
  .pd .u { background:var(--p-ded); }
  .pending .thr { background:repeating-linear-gradient(45deg, var(--surface2) 0 5px,
                   color-mix(in srgb,var(--accent) 25%,var(--surface)) 5px 10px) !important; }
  .legend { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; padding-top:10px;
            border-top:1px dashed var(--line); }
  .pool-chip { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line2);
               background:var(--surface); border-radius:999px; padding:3px 12px; font-size:12px; }
  .pool-chip .sw { width:10px; height:10px; border-radius:2px; }
  .pool-chip.droppable { border-style:dashed; }
  .pool-chip.drop-ok { border-color:var(--ok); background:var(--accent-soft); }

  /* ── 内存条 ── */
  .membar { display:flex; gap:2px; height:32px; border-radius:6px; overflow:hidden;
            background:var(--surface); border:1px solid var(--line2); margin:8px 0 4px;
            user-select:none; -webkit-user-select:none; }
  .gauge, .cores { user-select:none; -webkit-user-select:none; }
  .mseg { position:relative; min-width:2px; }
  .mseg span { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
               font-family:"JetBrains Mono",monospace; font-size:10px; color:#fff;
               text-shadow:0 1px 2px rgba(0,0,0,.45); white-space:nowrap; overflow:hidden; }
  .mseg.kern { background:repeating-linear-gradient(45deg, var(--kern) 0 6px,
                 color-mix(in srgb,var(--kern) 70%,var(--surface)) 6px 12px); }
  .mseg.vmf { background:repeating-linear-gradient(-45deg, var(--p-vm) 0 6px,
                color-mix(in srgb,var(--p-vm) 55%,var(--surface)) 6px 12px); }
  .mseg.free { background:var(--surface2); }
  .fl-strip { display:flex; flex-wrap:wrap; gap:6px 16px; align-items:center; margin-top:10px; padding:8px 12px;
              border:1px dashed var(--p-vm); border-radius:8px; font-size:12px; color:var(--muted);
              background:color-mix(in srgb,var(--p-vm) 6%,var(--surface)); }
  .fl-strip b { color:var(--ink); font-variant-numeric:tabular-nums; }
  .fl-strip .nm { font-family:"JetBrains Mono",monospace; font-size:11.5px; color:var(--ink); }
  .mseg.free span { color:var(--muted); text-shadow:none; }
  .grip { width:8px; flex:none; background:var(--surface); cursor:col-resize; position:relative; touch-action:none; }
  .grip::after { content:""; position:absolute; left:2.5px; right:2.5px; top:8px; bottom:8px;
                 border-left:1.5px solid var(--muted); border-right:1.5px solid var(--muted); }
  .grip:hover::after, .grip.on::after { border-color:var(--accent); }
  .mem-note { display:flex; flex-wrap:wrap; gap:4px 16px; font-size:11.5px; color:var(--muted); }
  .mem-note b { color:var(--ink); font-variant-numeric:tabular-nums; font-weight:600; }

  /* ── tiering ── */
  .gauge { position:relative; height:12px; border-radius:6px; background:var(--surface2);
           border:1px solid var(--line); margin:14px 0 4px; }
  .gauge .fill { position:absolute; left:0; top:0; bottom:0; background:var(--accent); border-radius:6px 0 0 6px; opacity:.75; }
  .gtick { position:absolute; top:-5px; bottom:-5px; width:10px; margin-left:-5px; cursor:col-resize; touch-action:none; }
  .gtick::after { content:""; position:absolute; left:4px; top:0; bottom:0; width:2px; }
  .gtick.evict::after { background:var(--warn); }
  .gtick.back::after { background:var(--ok); }
  .gtick-lab { font-size:11px; color:var(--muted); display:flex; gap:18px; }
  .gtick-lab b { color:var(--ink); font-variant-numeric:tabular-nums; }
  .mt-row { display:grid; grid-template-columns:110px 58px minmax(0,1fr) 168px; gap:10px; align-items:center;
            padding:7px 0; border-bottom:1px dashed var(--line); font-size:12.5px; }
  .mt-row:last-child { border-bottom:0; }
  .mt-bar { display:flex; gap:2px; height:15px; border-radius:4px; overflow:hidden; background:var(--surface2); }
  .mt-res { background:var(--p-vm); }
  .mt-swp { background:repeating-linear-gradient(45deg, var(--swap) 0 5px,
              color-mix(in srgb,var(--swap) 45%,var(--surface)) 5px 10px); }
  .mt-num { font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--muted); text-align:right;
            font-variant-numeric:tabular-nums; }
  .prio { border:1px solid var(--line2); background:var(--surface); border-radius:5px;
          font-size:11px; padding:1px 6px; color:var(--muted); }

  /* ── 右栏 ── */
  .vm-row { display:flex; align-items:center; gap:8px; padding:8px 6px; border-bottom:1px dashed var(--line);
            border-radius:6px; font-size:12.5px; cursor:pointer; }
  .vm-row:hover { background:var(--surface2); }
  .vm-row .dot { width:8px; height:8px; border-radius:50%; flex:none; }
  .vm-row .nm { font-weight:600; }
  .vm-row .cs { display:flex; gap:4px; flex-wrap:wrap; margin-left:auto; justify-content:flex-end; }
  .mini { font-size:10.5px; border:1px solid var(--line); border-radius:4px; padding:0 5px; color:var(--muted);
          white-space:nowrap; }
  .tier { display:inline-block; min-width:16px; text-align:center; font-family:"JetBrains Mono",monospace; font-size:10.5px;
          font-weight:700; border-radius:4px; padding:0 4px; color:#fff; }
  .tier.A { background:var(--p-ded); } .tier.B { background:var(--p-vm); } .tier.C { background:var(--kern); }
  .tier.V { background:var(--hp1g); }
  .lock { font-size:10.5px; color:var(--muted); }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:3px 12px; font-size:12px; color:var(--muted); margin:8px 0; }
  .kv b { color:var(--ink); font-variant-numeric:tabular-nums; font-weight:600; }
  .nodestat { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:8px 0; }
  .nodestat > div { border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:11.5px; color:var(--muted); }
  .nodestat b { color:var(--ink); font-variant-numeric:tabular-nums; }
  .prog { height:8px; border-radius:4px; background:var(--surface2); overflow:hidden; margin:4px 0; }
  .prog i { display:block; height:100%; background:var(--accent); }
  .ev { display:grid; grid-template-columns:38px 1fr; gap:8px; padding:5px 0; border-top:1px dashed var(--line); font-size:11.5px; }
  .ev .t { font-family:"JetBrains Mono",monospace; color:var(--muted); }
  .ev .why { color:var(--muted); }
  .thr-in { width:56px; font:inherit; font-size:12px; border:1px solid var(--line2); border-radius:5px; padding:1px 5px;
            background:var(--surface); color:var(--ink); }
  .thr-in:disabled { opacity:.6; }
  .tierbox { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; align-items:center; border:1.5px solid; border-radius:8px;
             padding:8px 12px; margin:8px 0; font-size:12px; }
  .act { display:flex; gap:8px; align-items:baseline; font-size:12px; padding:4px 0; border-top:1px dashed var(--line); }
  .act .why { color:var(--muted); }
  .nsbar { display:flex; gap:2px; height:12px; border-radius:4px; overflow:hidden; background:var(--surface2); margin:6px 0; max-width:360px; }
  .nsbar i { display:block; height:100%; }
  .steps { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; font-size:11.5px; }
  .steps span { border:1px solid var(--line2); border-radius:999px; padding:1px 9px; color:var(--muted); }
  .steps span.done { border-color:var(--ok); color:var(--ok); }
  .steps span.cur { border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
  .auto-banner { display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-size:12.5px; padding:8px 12px;
                 border:1px dashed var(--line2); border-radius:8px; margin:0 0 14px; background:var(--surface); }
  .chg { display:flex; gap:8px; align-items:baseline; padding:6px 2px; border-bottom:1px dashed var(--line);
         font-size:12.5px; }
  .chg .undo { margin-left:auto; border:0; background:none; color:var(--muted); font-size:12px; }
  .chg .undo:hover { color:var(--bad); }
  .issue { font-size:12.5px; padding:5px 8px; border-radius:6px; margin:4px 0; }
  .issue.block { background:var(--bad-bg); color:var(--bad); }
  .issue.warn { background:var(--warn-bg); color:var(--warn); }
  .issue.ok { background:var(--accent-soft); color:var(--accent); }

  /* ── VM 视图 ── */
  .vhead { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:16px 0 14px; }
  .vhead h1 { font-size:18px; margin:0; }
  .back { border:0; background:none; color:var(--accent); font-size:13px; padding:0; }
  .radio-row { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; }
  .radio-card { border:1.5px solid var(--line2); border-radius:8px; padding:8px 14px; font-size:13px;
                background:var(--surface); text-align:left; }
  .radio-card.on { border-color:var(--accent); background:var(--accent-soft); }
  .radio-card:disabled { opacity:.45; }
  .radio-card small { display:block; font-size:11px; color:var(--muted); }
  .vcpu-chip { display:inline-flex; align-items:center; gap:5px; border:1.5px solid var(--p-ded);
               background:color-mix(in srgb,var(--p-ded) 12%,var(--surface)); border-radius:6px;
               padding:3px 10px; font-family:"JetBrains Mono",monospace; font-size:12px; cursor:grab; }
  .vcpu-chip.pinned { border-style:solid; opacity:.55; cursor:default; }
  .vcpu-chip[draggable="true"]:active { cursor:grabbing; }
  .thr.pin-own { background:color-mix(in srgb,var(--p-ded) 25%,var(--surface)); }
  .thr.pin-oth { opacity:.5; }
  .thr .px { position:absolute; right:1px; top:0; z-index:2; border:0; background:none; color:var(--bad);
             font-size:10px; line-height:1; padding:1px; cursor:pointer; }
  .vnode-card { border:1px solid var(--line2); border-left:4px solid var(--p-virt); border-radius:8px;
                padding:10px 12px; font-size:12.5px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .vnode-card input, .vnode-card select, .inspector select, .inspector input {
    font:inherit; font-size:12.5px; color:var(--ink); background:var(--surface); border:1px solid var(--line2);
    border-radius:5px; padding:2px 6px; width:64px; }
  .vnode-card select { width:auto; }
  .num-in { width:70px !important; }

  /* ── toast ── */
  #toasts { position:fixed; right:18px; bottom:18px; display:flex; flex-direction:column; gap:8px; z-index:50; }
  .toast { background:var(--ink); color:var(--bg); border-radius:8px; padding:9px 16px; font-size:13px;
           box-shadow:0 4px 16px rgba(0,0,0,.25); max-width:360px; }
  .toast.err { background:var(--bad); color:#fff; }
  .toast.ok { background:var(--ok); color:#fff; }

  .foot { margin-top:26px; font-size:11.5px; color:var(--muted); }
</style>
</head>
<body>

<div class="shell"><div id="app"></div>
<div class="foot">交互原型 · 数据为模拟，无后端 —— 对应设计稿 <span class="mono">docs/resource-planning.md</span> §5。查看模式展示实时叠加；「编辑」后可拖拽：核→池图例、VM 行→核、内存段手柄、水位线刻度；VM 视图内 vCPU→线程格。</div>
</div>
<div id="toasts"></div>

<script>
"use strict";
/* ───────────────────────── 数据 ───────────────────────── */
const NODE_MEM = 128, KERN_G = 6, SAFETY_G = 5, HP2M_USED = {0:2,1:0};
const POOLS = { system:{n:"操作系统",cls:"po",v:"--p-os"}, virt:{n:"虚拟化服务",cls:"pv",v:"--p-virt"},

/* 浮动判定：不绑核且不绑 NUMA（跑在未预留的共享池上） */

  if(pl.numa==="manual"&&pl.vnodes) return pl.vnodes.filter(v=>v.host===node).reduce((s,v)=>s+v.memGB,0)/vm.memGB;
  if(pl.numa==="auto") return pl.node===node?1:0;

  for(const [id,pl] of Object.entries(P().place)){ if(VMS[id].state!=="running"||pl.backend!=="hp1g") continue;
    used+=VMS[id].memGB*nodeShare(id,pl,node); } return Math.round(used*10)/10; }
function vmPoolBudget(node){ const m=P().mem[node];
  return NODE_MEM - KERN_G - SAFETY_G - m.os - m.virt - m.hp2m - m.hp1g; }
/* VM 池已用，拆成 绑定 VM（bound）与 浮动 VM（floating）两部分 */
function vmPoolUsedSplit(node){ let b=0, f=0;
  for(const [id,pl] of Object.entries(P().place)){ const vm=VMS[id];
    if(vm.state!=="running"||pl.backend==="hp1g"||pl.backend==="hp2m") continue;
    const g = (vm.mt ? vm.mt.res : vm.memGB) * nodeShare(id,pl,node);
    if(isFloating(pl)) f+=g; else b+=g; }
  return { bound:Math.round(b*10)/10, floating:Math.round(f*10)/10 }; }
function vmPoolUsed(node){ const s=vmPoolUsedSplit(node); return Math.round((s.bound+s.floating)*10)/10; }
/* 浮动 VM 汇总：台数 / Σ vCPU / 共享池可用线程（扣掉独占绑定）/ 超分比 */
function floatingStats(plan){
  const ded=dedCores(plan);
  const vms=Object.entries(plan.place).filter(([id,pl])=>isFloating(pl)&&VMS[id].state==="running").map(([id])=>id);
  const vcpus=vms.reduce((s,id)=>s+VMS[id].vcpus,0);
  const threads=Object.keys(plan.corePool).filter(c=>plan.corePool[c]==="vm"&&!ded[c]).length*2;
  const maxV=vms.reduce((m,id)=>Math.max(m,VMS[id].vcpus),0);
  return { vms, vcpus, threads, maxV, ratio: threads?Math.round(vcpus/threads*10)/10:Infinity }; }
/* 放置等级：A 独占 / B 节点共享 / C 浮动 / V 显式 vNUMA（只能手动） */
function tierOf(pl){ if(pl.numa==="manual") return "V"; if(pl.mode==="dedicated") return "A"; return pl.numa==="auto"?"B":"C"; }
function forcedManual(pl){ return pl.numa==="manual"||pl.backend==="hp1g"; }
/* 控制器视角的节点统计：共享池可用线程、oc（B 级 + 浮动按线程比例分摊）、空闲独占核、空闲内存 */
function autoStats(plan){
  const ded=dedCores(plan), out={};
  const thr=n=>nodeCores(n).filter(c=>plan.corePool[c]==="vm"&&!ded[c]).length*2;
  const tot=thr(0)+thr(1);
  const flVcpu=Object.entries(plan.place).filter(([id,pl])=>isFloating(pl)&&VMS[id].state==="running").reduce((s,[id])=>s+VMS[id].vcpus,0);
  for(const n of [0,1]){
    const t=thr(n);
    const bV=Object.entries(plan.place).filter(([id,pl])=>pl.mode==="shared"&&pl.numa==="auto"&&pl.node===n&&VMS[id].state==="running").reduce((s,[id])=>s+VMS[id].vcpus,0);
    const fl=tot?flVcpu*t/tot:0;
    out[n]={ threads:t, oc:t?Math.round((bV+fl)/t*100)/100:Infinity,
             freeDed:nodeCores(n).filter(c=>plan.corePool[c]==="vm"&&!ded[c]).length,
             freeMem:Math.max(0,Math.round((vmPoolBudget(n)-vmPoolUsed(n))*10)/10) };
  }

/* ── §3.10.2/3 负载档位 + 求解器 + 差分 ── */
const PRIO_W={high:0,normal:1,low:2};
function loadIndex(plan){
  const a=plan.auto, ded=dedCores(plan);
  const runAuto=Object.entries(plan.place).filter(([id,pl])=>pl.source==="auto"&&VMS[id].state==="running");
  const sharedCores=Object.keys(plan.corePool).filter(c=>plan.corePool[c]==="vm").length;
  const fixedPinned=Object.entries(ded).filter(([,vm])=>plan.place[vm].source==="manual").length;
  const availDed=sharedCores-fixedPinned-MIN_SHARED_CORES*2;
  const needDed=runAuto.reduce((s,[id])=>s+Math.ceil(VMS[id].vcpus/2),0);
  const sharedThr=(sharedCores-Object.keys(ded).length)*2;
  const bcV=Object.entries(plan.place).filter(([id,pl])=>pl.mode==="shared"&&VMS[id].state==="running").reduce((s,[id])=>s+VMS[id].vcpus,0);
  const oc=sharedThr?Math.round(bcV/sharedThr*100)/100:Infinity;
  const memRatio=Math.round((vmPoolUsed(0)+vmPoolUsed(1))/(vmPoolBudget(0)+vmPoolBudget(1))*100)/100;
  const psi=LOADS[S.load].psi;
  const L=Math.round(Math.max(oc/a.bindMaxOc, memRatio, psi)*100)/100;
  const tier = (oc>=a.releaseOc||memRatio>=0.95) ? "紧张" : (needDed<=availDed&&oc<=a.dedicateMaxOc&&memRatio<0.8) ? "宽裕" : "适中";
  return { L, tier, oc, memRatio, psi, needDed, availDed };

const TIER_FORM={ "宽裕":"全部 A（独占绑核 + 绑节点），按节点装箱", "适中":"A/B 混合：优先级高、CPU 忙的保留独占，其余绑节点共享", "紧张":"释放全部独占，B/C 均衡超分；内存放不下的允许浮动跨节点" };
/* 求目标放置：固定 VM 先占位 → 自动 VM 按优先级、vCPU 降序装箱；以当前放置为初解（能不动就不动） */
function solveTarget(plan){
  const li=loadIndex(plan), a=plan.auto, target={};
  const freeCores={0:[],1:[]}, memUsed={0:0,1:0}, ded=dedCores(plan);
  for(const n of [0,1]) freeCores[n]=nodeCores(n).filter(c=>plan.corePool[c]==="vm"&&(!ded[c]||plan.place[ded[c]].source==="auto"));
  const resOf=id=>VMS[id].mt?VMS[id].mt.res:VMS[id].memGB;
  for(const [id,pl] of Object.entries(plan.place)){ if(VMS[id].state!=="running") continue;
    if(pl.source==="manual"){ for(const n of [0,1]) memUsed[n]+=resOf(id)*nodeShare(id,pl,n)+(pl.reserveGB||0)*(pl.numa==="auto"?(pl.node===n?1:0):0.5); } }
  const fits=(id,n,extra)=>memUsed[n]+resOf(id)*1.1+(extra||0)<=vmPoolBudget(n);
  const vms=Object.entries(plan.place).filter(([id,pl])=>pl.source==="auto"&&VMS[id].state==="running")
    .sort((x,y)=>PRIO_W[x[1].prio]-PRIO_W[y[1].prio]||VMS[y[0]].vcpus-VMS[x[0]].vcpus);
  const curNode=pl=>pl.numa==="auto"||pl.mode==="dedicated"?pl.node:null;
  for(const [id,pl] of vms){ const vm=VMS[id], need=Math.ceil(vm.vcpus/2);
    const wantA = li.tier==="宽裕" || (li.tier==="适中" && (pl.prio==="high"||pl.mode==="dedicated"));
    let placed=null;
    if(wantA){ const order=[curNode(pl),0,1].filter((n,i,arr)=>n!==null&&arr.indexOf(n)===i);
      for(const n of order){ if(freeCores[n].length-need>=MIN_SHARED_CORES&&fits(id,n)){
        const keep=Object.values(pl.pins).map(t=>t<16?t:t-16).filter((c,i,arr)=>arr.indexOf(c)===i&&freeCores[n].includes(c));
        const cores=[...keep,...freeCores[n].filter(c=>!keep.includes(c))].slice(0,need);
        freeCores[n]=freeCores[n].filter(c=>!cores.includes(c)); memUsed[n]+=resOf(id);
        const pins={}; let v=0; for(const c of cores) for(const t of coreThreads(c)) if(v<vm.vcpus) pins[v++]=t;
        placed={mode:"dedicated",numa:"auto",node:n,pins}; break; } } }
    if(!placed){ const cn=curNode(pl);
      const imb=Math.abs(memUsed[0]/vmPoolBudget(0)-memUsed[1]/vmPoolBudget(1))*100;
      let n = cn!==null&&fits(id,cn)&&imb<=a.numaImbalancePct ? cn : [0,1].sort((x,y)=>memUsed[x]/vmPoolBudget(x)-memUsed[y]/vmPoolBudget(y))[0];
      if(fits(id,n)){ memUsed[n]+=resOf(id); placed={mode:"shared",numa:"auto",node:n,pins:{}}; }
      else { for(const k of [0,1]) memUsed[k]+=resOf(id)*0.5; placed={mode:"shared",numa:"none",node:0,pins:{}}; } }
    target[id]=placed; }
  return {target,li};
}
function diffActions(plan){
  const {target,li}=solveTarget(plan), acts=[];
  for(const [id,t] of Object.entries(target)){ const c=plan.place[id], ct=tierOf(c), tt=tierOf(t);
    const cn=(c.numa==="auto"||c.mode==="dedicated")?c.node:null, tn=t.numa==="auto"?t.node:null;
    const moved=cn!==null&&tn!==null&&cn!==tn;
    if(ct===tt&&!moved&&JSON.stringify(c.pins)===JSON.stringify(t.pins)) continue;
    const kind = moved?"move" : ct==="A"&&tt!=="A"?"unpin" : tt==="A"?"pin" : ct==="C"&&tt==="B"?"bind" : "unbind";
    acts.push({ id, t, kind, cost:kind==="move"?"move":"free", from:ct+(cn!==null?"·N"+cn:""), to:tt+(tn!==null?"·N"+tn:""),
      label:{move:"换节点（vCPU 即时 + 内存迁页）",unpin:"解绑独占核",pin:"绑定独占核",bind:"收编：绑定节点（只写 cpuset）",unbind:"放开为浮动"}[kind] }); }
  acts.sort((x,y)=>(x.cost==="move")-(y.cost==="move"));
  return {acts,li,target};

/* 在线换节点：vCPU 立即切换，内存后台迁页（模拟） */
function startMig(id,to,mode,pins){

  const orig={0:nodeShare(id,pl,0),1:nodeShare(id,pl,1)}, from=1-to;   // 目标节点之外的那个节点是来源
  Object.assign(pl,{numa:"auto",node:to,mode:mode||pl.mode,pins:pins||(mode==="dedicated"?pl.pins:{})});
  if(S.draft) S.draft.place[id]=clone(pl);
  const total=Math.round(res*(1-orig[to])*10)/10;
  S.migs.push({vm:id,from,to,pct:0,total,bw:1.4,orig,dur:Math.max(5,total/1.4)});
  EVENTS.unshift({t:now(),vm:id,act:"换节点",from:"N"+from,to:"N"+to,why:`AllowedCPUs 已切到 N${to}（即时）；AllowedMemoryNodes=N${to} 触发内核迁页 ${total}G`,st:"进行中"});
}
const now=()=>new Date().toTimeString().slice(0,5);
setInterval(()=>{ if(!S.migs.length) return;
  for(const m of [...S.migs]){ m.pct=Math.min(100,m.pct+100/m.dur);
    if(m.pct>=100){ S.migs.splice(S.migs.indexOf(m),1); const vm=VMS[m.vm], res=vm.mt?vm.mt.res:vm.memGB;
      vm.nsplit={0:0,1:0}; vm.nsplit[m.to]=res;
      const ev=EVENTS.find(e=>e.vm===m.vm&&e.st==="进行中"); if(ev) ev.st="已应用";

  if(S.edit){ document.querySelectorAll("[data-migprog]").forEach(el=>{ const m=S.migs.find(x=>x.vm===el.dataset.migprog); el.style.width=(m?m.pct:100)+"%"; });
              document.querySelectorAll("[data-migpct]").forEach(el=>{ const m=S.migs.find(x=>x.vm===el.dataset.migpct); el.textContent=m?Math.round(m.pct)+"%":"100%"; }); }

/* 执行一拍：免费动作全做，换节点最多一台 */
function runTick(advise){
  const {acts,li}=diffActions(S.applied); let moved=false, done=0;
  if(!acts.length){ EVENTS.unshift({t:now(),vm:"—",act:advise?"建议":"再平衡",from:"",to:"",why:`本拍无动作：${li.tier}档 L=${li.L}，当前放置已是最优`,st:advise?"仅建议":"已应用"}); return; }
  for(const ac of acts){
    if(advise){ EVENTS.unshift({t:now(),vm:ac.id,act:"建议·"+ac.label,from:ac.from,to:ac.to,why:`${li.tier}档 L=${li.L}`,st:"仅建议"}); continue; }
    if(ac.cost==="move"){ if(moved||S.migs.length){ continue; } moved=true; startMig(ac.id,ac.t.node,ac.t.mode,ac.t.pins); done++; continue; }
    const pl=S.applied.place[ac.id]; Object.assign(pl,{mode:ac.t.mode,numa:ac.t.numa,node:ac.t.node,pins:ac.t.pins});
    if(ac.t.numa==="auto"&&VMS[ac.id].nsplit){ const res=VMS[ac.id].mt?VMS[ac.id].mt.res:VMS[ac.id].memGB; VMS[ac.id].nsplit={0:0,1:0}; VMS[ac.id].nsplit[ac.t.node]=res; }
    if(S.draft) S.draft.place[ac.id]=clone(pl);
    EVENTS.unshift({t:now(),vm:ac.id,act:ac.label,from:ac.from,to:ac.to,why:`${li.tier}档 L=${li.L}（oc ${li.oc}× · 内存 ${Math.round(li.memRatio*100)}% · PSI ${li.psi}）`,st:"已应用"}); done++; }
  const left=acts.filter(a=>a.cost==="move").length-(moved?1:0);
  if(!advise&&left>0) EVENTS.unshift({t:now(),vm:"—",act:"排队",from:"",to:"",why:`还有 ${left} 个换节点动作留到下一拍（每拍最多 1 台、主机同时 1 个迁移）`,st:"已应用"});
}
function setLoad(level){ S.load=level; const run=new Set(LOADS[level].running);
  for(const id of Object.keys(VMS)) VMS[id].state=run.has(id)?"running":"shutoff";
  S.migs=S.migs.filter(m=>VMS[m.vm].state==="running"); initUtil(); render();
  const li=loadIndex(S.applied); toast(`负载模拟：${level==="low"?"低":level==="mid"?"中":"高"} → ${li.tier}档（L=${li.L}）`); }
function dedCores(plan){ const m={}; for(const [id,pl] of Object.entries(plan.place)){
  if(pl.mode!=="dedicated") continue;
  Object.values(pl.pins).forEach(t=>{ m[t<16?t:t-16]=id; }); } return m; }
function pinnedBy(plan,thr){ for(const [id,pl] of Object.entries(plan.place))
  for(const [v,t] of Object.entries(pl.pins)) if(t===thr) return {vm:id,v:+v}; return null; }

/* ───────────────────────── 变更 diff ───────────────────────── */
function computeChanges(){
  if(!S.edit) return [];
  const a=S.applied, d=S.draft, out=[];
  for(const c of Object.keys(d.corePool)) if(d.corePool[c]!==a.corePool[c])
    out.push({k:"core",c:+c,label:`核 ${c}·${+c+16} → ${POOLS[d.corePool[c]].n}`,badge:"now"});
  for(const n of [0,1]) for(const f of ["os","virt","hp2m","hp1g"]) if(d.mem[n][f]!==a.mem[n][f])
    out.push({k:"mem",n:+n,f,label:`NUMA${n} ${{os:"OS 预留",virt:"虚拟化预留",hp2m:"大页 2M",hp1g:"大页 1G"}[f]} ${a.mem[n][f]}G → ${d.mem[n][f]}G`,
              badge:f==="hp1g"?"boot":"now"});
  if(d.wm.evict!==a.wm.evict) out.push({k:"wm",f:"evict",label:`下刷水位 ${a.wm.evict}% → ${d.wm.evict}%`,badge:"now"});
  if(d.wm.back!==a.wm.back) out.push({k:"wm",f:"back",label:`回血水位 ${a.wm.back}% → ${d.wm.back}%`,badge:"now"});
  if(d.spdkBoot!==a.spdkBoot) out.push({k:"boot",label:`低抖动启动档 ${d.spdkBoot?"开启":"关闭"}`,badge:"boot"});
  const AUTO_L={enabled:"自动放置开关",mode:"控制器模式",dedicateMaxOc:"独占超分上限",releaseOc:"释放超分",numaImbalancePct:"NUMA 失衡 %"};
  for(const f of Object.keys(AUTO_L)) if(d.auto[f]!==a.auto[f])
    out.push({k:"auto",f,label:`${AUTO_L[f]} ${fmtAuto(f,a.auto[f])} → ${fmtAuto(f,d.auto[f])}`,badge:"now"});
  for(const id of Object.keys(d.place)){ const pa=a.place[id], pd=d.place[id];
    if(JSON.stringify(pa.pins)!==JSON.stringify(pd.pins)||pa.mode!==pd.mode||pa.numa!==pd.numa)
      out.push({k:"place",id,label: pd.mode==="dedicated"
        ? `${id} 独占绑定 核 ${[...new Set(Object.values(pd.pins).map(t=>t<16?t:t-16))].join(",")}${pa.numa==="none"?"（内存改绑 NUMA"+pd.node+"，下次启动）":""}`
        : `${id} 取消独占 → 回到浮动`, badge: VMS[id].state==="running"?"hot":"now"}); }
  return out;
}
function revertChange(ch){
  const a=S.applied, d=S.draft;
  if(ch.k==="core") d.corePool[ch.c]=a.corePool[ch.c];
  else if(ch.k==="mem") d.mem[ch.n][ch.f]=a.mem[ch.n][ch.f];
  else if(ch.k==="wm") d.wm[ch.f]=a.wm[ch.f];
  else if(ch.k==="boot") d.spdkBoot=a.spdkBoot;
  else if(ch.k==="auto") d.auto[ch.f]=a.auto[ch.f];
  else if(ch.k==="place") d.place[ch.id]=clone(a.place[ch.id]);
  S.issues=null; render();
}

/* ───────────────────────── 校验 ───────────────────────── */
function validate(plan){
  const iss=[]; const cnt=p=>Object.values(plan.corePool).filter(x=>x===p).length;
  if(cnt("system")<2) iss.push({lv:"block",msg:"操作系统池少于 2 个物理核"});
  if(cnt("virt")<2) iss.push({lv:"block",msg:"虚拟化服务池少于 2 个物理核"});
  const ded=dedCores(plan);
  for(const [c,vm] of Object.entries(ded)) if(plan.corePool[c]!=="vm"&&VMS[vm].state==="running")
    iss.push({lv:"block",msg:`核 ${c} 被运行中 ${vm} 独占绑定，不能移出虚拟机池（先解绑/迁移/关机）`});
  for(const n of [0,1]){
    const u1g=hp1gUsed(n); if(plan.mem[n].hp1g<u1g)
      iss.push({lv:"block",msg:`NUMA${n} 大页 1G 收缩到 ${plan.mem[n].hp1g}G，低于在用 ${u1g}G（VM/SPDK 占用）`});
    if(plan.mem[n].hp2m<HP2M_USED[n])
      iss.push({lv:"block",msg:`NUMA${n} 大页 2M 低于在用 ${HP2M_USED[n]}G`});
    const bud=vmPoolBudget(n), used=vmPoolUsed(n);
    if(bud<used) iss.push({lv:"block",msg:`NUMA${n} VM 池预算 ${bud}G 低于运行中占用 ${used}G`});
    else if(bud<used*1.2) iss.push({lv:"warn",msg:`NUMA${n} VM 池预算余量不足 20%（${used}G / ${bud}G）`});
  }
  if(plan.wm.evict>=plan.wm.back) iss.push({lv:"block",msg:"下刷水位必须低于回血水位"});
  if(cnt("spdk")>plan.spdkCap) iss.push({lv:"block",msg:`SPDK 池 ${cnt("spdk")}C 超过启动档声明的候选核上限 ${plan.spdkCap}C（改上限需重启）`});
  if(plan.auto.dedicateMaxOc>=plan.auto.releaseOc) iss.push({lv:"block",msg:"自动放置：独占超分上限必须低于释放超分（否则 A/B 反复升降）"});
  /* 浮动 VM 只能跑在未预留的共享池上：池被抽空 / 超分过高都要拦 */
  const fs=floatingStats(plan);
  if(fs.vms.length){
    if(fs.threads===0) iss.push({lv:"block",msg:`共享池已被抽空，${fs.vms.length} 台运行中的浮动 VM 无处调度`});
    else if(fs.threads<fs.maxV) iss.push({lv:"block",msg:`共享池仅剩 ${fs.threads} 线程，低于浮动 VM 最大规格 ${fs.maxV} vCPU`});
    else if(fs.ratio>4) iss.push({lv:"warn",msg:`浮动 VM vCPU 超分 ${fs.ratio}×（${fs.vcpus} vCPU / ${fs.threads} 线程），建议 ≤4×`});
    for(const n of [0,1]) if(!nodeCores(n).some(c=>plan.corePool[c]==="vm"))
      iss.push({lv:"warn",msg:`NUMA${n} 无共享池核，浮动 VM 落在该节点的内存将跨节点访问`});
  }
  for(const [id,pl] of Object.entries(plan.place)) if(pl.mode==="shared"&&pl.numa==="auto"&&VMS[id].state==="running"
      &&!nodeCores(pl.node).some(c=>plan.corePool[c]==="vm"))
    iss.push({lv:"block",msg:`${id} 绑定 NUMA${pl.node}，但该节点共享池已无核`});
  return iss;
}

    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
      ${Array.from({length:vm.vcpus},(_,v)=>{ const t=d.pins[v];
        return `<span class="vcpu-chip ${t!==undefined?"pinned":""}" ${t===undefined?'draggable="true"':""} data-vcpu="${v}">v${v}${t!==undefined?` → cpu${t}`:""}</span>`;}).join("")}
      <span class="sp"></span>
      <button class="btn" data-act="vm-auto" data-v="0">自动绑定 N0</button>
      <button class="btn" data-act="vm-auto" data-v="1">自动绑定 N1</button>
      <button class="btn ghost" data-act="vm-clear">清空</button></div>
    ${[0,1].map(n=>`<div class="numa"><div class="numa-cap"><b>NUMA ${n}</b><span>虚拟机池线程</span></div>
      <div class="cores">${nodeCores(n).filter(c=>S.applied.corePool[c]==="vm").map(c=>`
        <div class="core"><span class="tag"></span>${coreThreads(c).map(t=>{
          const own=Object.entries(d.pins).find(([,x])=>x===t);
          const oth=!own&&pinnedBy(S.applied,t)&&pinnedBy(S.applied,t).vm!==id?pinnedBy(S.applied,t):null;
          return `<div class="thr pm ${own?"pin-own":""} ${oth?"pin-oth":""}" data-thr="${t}"
            title="${oth?("已被 "+oth.vm+" 绑定"):("cpu "+t)}">
            ${own?`<button class="px" data-unpin="${own[0]}" title="解绑">×</button>`:""}
            <span class="n">${own?("v"+own[0]):oth?"占":t}</span></div>`;}).join("")}
        </div>`).join("")}</div></div>`).join("")}`;
}
function vnodeEditor(id,d){
  const vm=VMS[id]; d.vnodes=d.vnodes||[{vcpus:vm.vcpus,memGB:vm.memGB,host:0}];
  const sv=d.vnodes.reduce((s,v)=>s+ +v.vcpus,0), sm=d.vnodes.reduce((s,v)=>s+ +v.memGB,0);
  return `<div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
    ${d.vnodes.map((v,i)=>`<div class="vnode-card" style="border-left-color:${v.host===0?"var(--p-virt)":"var(--hp1g)"}">
      <b class="mono">vNUMA ${i}</b>
      <label>vCPU <input class="num-in" type="number" min="1" max="${vm.vcpus}" value="${v.vcpus}" data-vn="${i}" data-f="vcpus"></label>
      <label>内存 G <input class="num-in" type="number" min="1" max="${vm.memGB}" value="${v.memGB}" data-vn="${i}" data-f="memGB"></label>
      <label>→ 宿主 <select data-vn="${i}" data-f="host">${[0,1].map(n=>`<option value="${n}" ${v.host===n?"selected":""}>NUMA ${n}</option>`).join("")}</select></label>
      ${d.backend==="hp1g"?`<span class="sub">大页余量 ${Math.max(0,S.applied.mem[v.host].hp1g-hp1gUsed(v.host))}G</span>`:""}
      ${d.vnodes.length>1?`<button class="btn ghost" data-act="vn-del" data-v="${i}">删除</button>`:""}</div>`).join("")}
    <div style="display:flex;gap:10px;align-items:center">
      <button class="btn" data-act="vn-add" ${d.vnodes.length>=2?"disabled":""}>+ 增加 vNUMA 节点</button>
      <span class="sub">Σ vCPU <b style="color:${sv===vm.vcpus?"var(--ok)":"var(--bad)"}">${sv}/${vm.vcpus}</b> ·
        Σ 内存 <b style="color:${sm===vm.memGB?"var(--ok)":"var(--bad)"}">${sm}/${vm.memGB}G</b></span></div>
    <div class="sub mono">-numa node,nodeid=i,cpus=…,memdev=mi（memdev 按 host-nodes=… policy=bind）</div></div>`;
}

/* ───────────────────────── 事件 ───────────────────────── */
function toast(msg,kind){ const t=document.createElement("div"); t.className="toast "+(kind||"");
  t.textContent=msg; $("#toasts").appendChild(t); setTimeout(()=>t.remove(),3200); }

document.addEventListener("click",e=>{
  const undo=e.target.closest("[data-undo]");
  if(undo){ revertChange(computeChanges()[+undo.dataset.undo]); return; }
  const unpin=e.target.closest("[data-unpin]");
  if(unpin){ delete S.vmDraft.pins[unpin.dataset.unpin]; render(); return; }
  const el=e.target.closest("[data-act],[data-pool],.vm-row,.core");
  if(!el) return;
  const act=el.dataset.act;
  if(act==="edit"){ S.edit=true; S.draft=clone(S.applied); S.issues=null; S.sel.clear(); render(); return; }
  if(act==="cancel"){ S.edit=false; S.draft=null; S.issues=null; S.sel.clear(); render(); return; }
  if(act==="validate"){ S.issues=validate(S.draft); render(); return; }
  if(act==="apply"){ const iss=validate(S.draft);
    if(iss.some(i=>i.lv==="block")){ S.issues=iss; render(); toast("存在阻塞项，无法应用","err"); return; }
    const chgs=computeChanges(); const boot=chgs.filter(c=>c.badge==="boot").map(c=>c.label);
    toast("任务 applyResourcePlan 已提交…");
    setTimeout(()=>{ const old=S.applied; S.applied=clone(S.draft); S.edit=false; S.draft=null; S.issues=null; S.sel.clear();
      /* 运行中 VM 在主机视图被拖成独占/换了节点 → 走在线迁移 */
      for(const [id,pl] of Object.entries(S.applied.place)){ const o=old.place[id];
        if(VMS[id].state==="running"&&pl.numa==="auto"&&!(o.numa==="auto"&&o.node===pl.node)&&!S.migs.length&&nodeShare(id,o,pl.node)<0.95){
          const keep=clone(pl); S.applied.place[id]=clone(o); startMig(id,keep.node,keep.mode,keep.pins); Object.assign(S.applied.place[id],{source:keep.source}); } }
      S.pendBoot=boot; render(); toast(`应用成功 · ${chgs.length-boot.length} 项已生效${boot.length?` · ${boot.length} 项待重启`:""}`,"ok"); },900);
    return; }
  if(act==="dismiss-banner"){ S.pendBoot=[]; render(); return; }
  if(act==="toggle-svc"){ S.showSvc=!S.showSvc; render(); return; }
  if(act==="spdk-boot"){ if(S.edit){ S.draft.spdkBoot=el.checked; render(); } return; }
  if(act==="back"){ S.route="host"; S.vmDraft=null; render(); return; }
  if(act==="vm-mode"){ S.vmDraft.mode=el.dataset.v; if(el.dataset.v==="shared") S.vmDraft.pins={}; render(); return; }
  if(act==="vm-numa"){ S.vmDraft.numa=el.dataset.v; if(el.dataset.v==="auto"&&S.vmDraft.node===undefined) S.vmDraft.node=0; render(); return; }
  if(act==="vm-backend"){ const b=el.dataset.v; S.vmDraft.backend=b; if(b!=="anon") S.vmDraft.tiering=false; render(); return; }
  if(act==="vm-auto"){ autoPin(+el.dataset.v); return; }
  if(act==="vm-clear"){ S.vmDraft.pins={}; render(); return; }
  if(act==="vn-add"){ S.vmDraft.vnodes.push({vcpus:1,memGB:1,host:1}); render(); return; }
  if(act==="vn-del"){ S.vmDraft.vnodes.splice(+el.dataset.v,1); render(); return; }
  if(act==="vm-cancel"){ S.vmDraft=clone(S.applied.place[S.route]); render(); return; }
  if(act==="vm-source"){ S.vmDraft.source=el.dataset.v; render(); return; }
  if(act==="auto-enabled"){ if(S.edit){ S.draft.auto.enabled=el.checked; S.issues=null; render(); } return; }
  if(act==="auto-mode"){ if(S.edit){ S.draft.auto.mode=el.dataset.v; S.issues=null; render(); } return; }
  if(act==="auto-tick"){ const advise=el.dataset.v==="advise"; toast(advise?"任务 placementAdvise 已提交…":"任务 placementRebalance 已提交…");
    setTimeout(()=>{ runTick(advise); initUtil(); render(); toast(advise?"建议已生成":"控制器已执行一拍","ok"); },600); return; }
  if(act==="sim-load"){ setLoad(el.dataset.v); return; }
  if(act==="vm-save"){ saveVm(); return; }
  /* 池图例点击 = 分配所选 */
  if(el.dataset.pool && S.edit && S.sel.size){
    S.sel.forEach(c=>{ S.draft.corePool[c]=el.dataset.pool; }); S.sel.clear(); S.issues=null; render(); return; }
  /* 核心点选（编辑态多选） */
  const core=e.target.closest(".core[data-core]");
  if(core && S.edit && S.route==="host"){ const c=+core.dataset.core;
    S.sel.has(c)?S.sel.delete(c):S.sel.add(c); render(); return; }
  const row=e.target.closest(".vm-row[data-vm]");
  if(row){ S.route=row.dataset.vm; S.vmDraft=clone(S.applied.place[row.dataset.vm]); render(); return; }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.act==="vm-node"){ S.vmDraft.node=+el.value; render(); return; }
  if(el.dataset.act==="vm-tiering"){ S.vmDraft.tiering=el.checked; render(); return; }
  if(el.dataset.act==="vm-prio"){ S.vmDraft.prio=el.value; return; }
  if(el.dataset.act==="vm-reserve"){ S.vmDraft.reserveGB=Math.max(0,+el.value||0); render(); return; }
  if(el.dataset.auto&&S.edit){ S.draft.auto[el.dataset.auto]=+el.value; S.issues=null; render(); return; }
  if(el.dataset.act==="spdk-boot"){ if(S.edit){ S.draft.spdkBoot=el.checked; render(); } return; }
  if(el.dataset.vn!==undefined){ const v=S.vmDraft.vnodes[+el.dataset.vn];
    v[el.dataset.f]=el.dataset.f==="host"?+el.value:Math.max(1,+el.value||1); render(); return; }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.act==="toggle-svc"){ S.showSvc=!S.showSvc; render(); }
});

function autoPin(node){
  const vm=VMS[S.route], d=S.vmDraft; d.pins={};
  const free=nodeCores(node).filter(c=>S.applied.corePool[c]==="vm").flatMap(coreThreads)
    .filter(t=>{ const p=pinnedBy(S.applied,t); return !p||p.vm===S.route; });
  if(free.length<vm.vcpus){ toast(`NUMA${node} 虚拟机池空闲线程不足（${free.length}/${vm.vcpus}）`,"err"); return; }
  for(let v=0;v<vm.vcpus;v++) d.pins[v]=free[v];
  render();
}
function saveVm(){
  const id=S.route, vm=VMS[id], d=S.vmDraft;
  if(d.mode==="dedicated"&&Object.keys(d.pins).length!==vm.vcpus){ toast(`独占模式需绑满 ${vm.vcpus} 个 vCPU`,"err"); return; }
  if(d.numa==="manual"){ const sv=d.vnodes.reduce((s,v)=>s+ +v.vcpus,0), sm=d.vnodes.reduce((s,v)=>s+ +v.memGB,0);
    if(sv!==vm.vcpus||sm!==vm.memGB){ toast("vNUMA 的 vCPU/内存合计必须等于 VM 规格","err"); return; } }
  const a=S.applied.place[id];
  const F=["mode","pins","numa","node","vnodes","backend"], changed=F.some(f=>JSON.stringify(a[f])!==JSON.stringify(d[f]));
  if(forcedManual(d)) d.source="manual";
  else if(changed&&d.source==="auto"&&a.source==="auto"){ d.source="manual"; toast("已手动修改放置，来源转为手动（控制器不再自动调整）"); }
  const hot = vm.state==="running" && a.backend===d.backend && d.numa!=="manual" && a.numa!=="manual";
  /* 运行中换绑定节点 = 在线迁移（准入） */
  const needMig = vm.state==="running" && d.numa==="auto" && !(a.numa==="auto"&&a.node===d.node) && nodeShare(id,a,d.node)<0.95;
  if(needMig){
    if(d.backend==="hp1g"){ toast("1G 大页 VM 不支持在线换节点，下次启动生效"); }
    else if(S.migs.length){ toast("主机已有内存迁移进行中，请稍后再试（同一时刻最多 1 个）","err"); return; }
    else { const res=vm.mt?vm.mt.res:vm.memGB; if(vmPoolBudget(d.node)-vmPoolUsed(d.node)<res*1.1){ toast(`NUMA${d.node} 空闲内存不足（需 ≥ ${Math.round(res*1.1*10)/10}G）`,"err"); return; } }
  }
  toast(vm.state==="running"?(needMig&&d.backend!=="hp1g"?"PATCH 已提交：vCPU 已切到目标节点，内存开始后台迁页…":hot?"PATCH vm placement 已提交（cpuset/绑定即时生效）…":"PATCH 已提交：绑定即时，vNUMA/后端下次启动生效…"):"已保存，下次启动生效…");
  setTimeout(()=>{ if(needMig&&d.backend!=="hp1g"){ const keep=clone(d); S.applied.place[id]=clone(a); startMig(id,d.node,keep.mode,keep.pins); Object.assign(S.applied.place[id],{source:keep.source,reserveGB:keep.reserveGB,backend:keep.backend,tiering:keep.tiering,prio:keep.prio}); S.vmDraft=clone(S.applied.place[id]); }
    else { S.applied.place[id]=clone(d); }
    if(S.draft) S.draft.place[id]=clone(S.applied.place[id]);
    render(); toast("放置已保存","ok"); },700);
}

/* ── 拖拽 ── */
let drag=null;
document.addEventListener("dragstart",e=>{
  const core=e.target.closest(".core[data-core]");
  const row=e.target.closest(".vm-row[data-vm]");
  const chip=e.target.closest(".vcpu-chip[data-vcpu]");
  if(core&&S.edit&&S.route==="host"){ drag={t:"core",c:+core.dataset.core}; e.dataTransfer.effectAllowed="move"; }
  else if(row&&S.edit&&S.route==="host"){ drag={t:"vm",id:row.dataset.vm}; e.dataTransfer.effectAllowed="move"; }
  else if(chip&&S.route!=="host"){ drag={t:"vcpu",v:+chip.dataset.vcpu}; e.dataTransfer.effectAllowed="move"; }
  else { e.preventDefault(); return; }
  e.dataTransfer.setData("text/plain","");
});
document.addEventListener("dragend",()=>{ drag=null;
  document.querySelectorAll(".drop-ok,.drop-no").forEach(el=>el.classList.remove("drop-ok","drop-no")); });
document.addEventListener("dragover",e=>{
  if(!drag) return;
  const poolChip=e.target.closest(".pool-chip[data-pool]");
  const core=e.target.closest(".core[data-core]");
  const thr=e.target.closest(".thr[data-thr]");
  if(drag.t==="core"&&poolChip){ e.preventDefault(); poolChip.classList.add("drop-ok"); }
  else if(drag.t==="vm"&&core){ e.preventDefault();
    core.classList.add(P().corePool[core.dataset.core]==="vm"?"drop-ok":"drop-no"); }
  else if(drag.t==="vcpu"&&thr){ const t=+thr.dataset.thr, oth=pinnedBy(S.applied,t);
    const bad=(oth&&oth.vm!==S.route)||Object.values(S.vmDraft.pins).includes(t);
    e.preventDefault(); thr.classList.add(bad?"drop-no":"drop-ok"); }
});
document.addEventListener("dragleave",e=>{
  const el=e.target.closest(".pool-chip,.core,.thr"); if(el) el.classList.remove("drop-ok","drop-no");
});
document.addEventListener("drop",e=>{
  if(!drag) return; e.preventDefault();
  const poolChip=e.target.closest(".pool-chip[data-pool]");
  const core=e.target.closest(".core[data-core]");
  const thr=e.target.closest(".thr[data-thr]");
  if(drag.t==="core"&&poolChip){
    const set=S.sel.has(drag.c)?[...S.sel]:[drag.c];
    set.forEach(c=>{ S.draft.corePool[c]=poolChip.dataset.pool; });
    S.sel.clear(); S.issues=null; render();
  } else if(drag.t==="vm"&&core){
    dedicateVm(drag.id,+core.dataset.core);
  } else if(drag.t==="vcpu"&&thr){
    const t=+thr.dataset.thr, oth=pinnedBy(S.applied,t);
    if((oth&&oth.vm!==S.route)||Object.values(S.vmDraft.pins).includes(t)){ toast("该线程已被占用","err"); }
    else { S.vmDraft.pins[drag.v]=t; render(); }
  }
  drag=null;
});
function dedicateVm(id,startCore){
  const vm=VMS[id], need=Math.ceil(vm.vcpus/2), node=coreNode(startCore);
  const ded=dedCores(S.draft);
  const cand=nodeCores(node).filter(c=>c>=startCore&&S.draft.corePool[c]==="vm"&&(!ded[c]||ded[c]===id)).slice(0,need);
  if(cand.length<need){ toast(`从核 ${startCore} 起，NUMA${node} 池内空闲核不足（需 ${need} 个）`,"err"); return; }
  const pl=S.draft.place[id], wasFloating=isFloating(pl);
  pl.mode="dedicated"; pl.pins={}; pl.node=node; if(pl.numa!=="manual") pl.numa="auto"; pl.source="manual";
  let v=0; for(const c of cand) for(const t of coreThreads(c)){ if(v<vm.vcpus) pl.pins[v++]=t; }
  S.issues=null; render();
  toast(`${id} → 独占核 ${cand.join(",")}（NUMA${node}）${wasFloating?"，内存随之绑 NUMA"+node+"（下次启动）":""}`);
}

/* ── 内存段手柄 / 水位线（pointer） ── */
let grip=null;
document.addEventListener("pointerdown",e=>{
  const g=e.target.closest(".grip"); const t=e.target.closest(".gtick");
  if(g&&S.edit){ const bar=g.closest(".membar");
    grip={t:"mem",node:+g.dataset.node,f:g.dataset.f,x:e.clientX,gPerPx:NODE_MEM/bar.getBoundingClientRect().width,
          v0:S.draft.mem[+g.dataset.node][g.dataset.f]};
    g.classList.add("on"); g.setPointerCapture(e.pointerId); }
  else if(t&&S.edit){ const bar=t.closest(".gauge").getBoundingClientRect();
    grip={t:"wm",f:t.dataset.wm,bar}; t.setPointerCapture(e.pointerId); }
});
document.addEventListener("pointermove",e=>{
  if(!grip) return;
  if(grip.t==="mem"){
    const nv=Math.round(grip.v0+(e.clientX-grip.x)*grip.gPerPx);
    const lim={os:[2,16],virt:[2,24],hp2m:[0,32],hp1g:[0,48]}[grip.f];
    S.draft.mem[grip.node][grip.f]=Math.min(lim[1],Math.max(lim[0],nv));
    render();
  } else {
    let pct=Math.round((e.clientX-grip.bar.left)/grip.bar.width*100);
    if(grip.f==="evict") pct=Math.min(S.draft.wm.back-5,Math.max(2,pct));
    else pct=Math.min(90,Math.max(S.draft.wm.evict+5,pct));
    S.draft.wm[grip.f]=pct; render();
  }
});
document.addEventListener("pointerup",()=>{ grip=null; });

render();
</script>

<button class="theme-fab" id="themeFab" title="切换亮/暗主题" aria-label="切换亮/暗主题">🌓</button>
<script>
  // 独立 demo：亮/暗主题切换（线上原型由宿主控制主题，这里自带按钮）
  (function(){
    var root = document.documentElement, KEY = 'xvirt-rp-demo.theme';
    try { var saved = localStorage.getItem(KEY); if (saved) root.setAttribute('data-theme', saved); } catch(e){}
    document.getElementById('themeFab').addEventListener('click', function(){
      var cur = root.getAttribute('data-theme');
      var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var isDark = cur ? cur === 'dark' : sysDark;
      var next = isDark ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem(KEY, next); } catch(e){}
    });
  })();
</script>
